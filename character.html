<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>사이퍼즈 캐릭터 랜덤 추첨기</title>

  <!-- 파비콘 (LUX C 로고) -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- 링크 공유 미리보기 -->
  <meta name="description" content="사이퍼즈 전 캐릭터 중복 없는 랜덤 추첨. 추첨 기록과 KST 서버 시계 지원.">
  <meta name="theme-color" content="#f5c451">
  <meta property="og:type" content="website">
  <meta property="og:title" content="사이퍼즈 캐릭터 랜덤 추첨기">
  <meta property="og:description" content="사이퍼즈 전 캐릭터 중복 없는 랜덤 추첨 — Presented by TeamLuX">
  <meta property="og:url" content="https://teamlux-official.github.io/cyphers-draw/character.html">
  <meta property="og:image" content="https://teamlux-official.github.io/cyphers-draw/og-character.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="사이퍼즈 캐릭터 랜덤 추첨기">
  <meta name="twitter:image" content="https://teamlux-official.github.io/cyphers-draw/og-character.png">

  <style>
    @font-face {
      font-family: 'DnfTemperedBlade';
      src: url('https://cdn.df.nexon.com/img/common/font/DNFForgedBlade-Light.otf') format('opentype');
      font-weight: 300;
      font-display: swap;
    }
    @font-face {
      font-family: 'DnfTemperedBlade';
      src: url('https://cdn.df.nexon.com/img/common/font/DNFForgedBlade-Medium.otf') format('opentype');
      font-weight: 500;
      font-display: swap;
    }
    @font-face {
      font-family: 'DnfTemperedBlade';
      src: url('https://cdn.df.nexon.com/img/common/font/DNFForgedBlade-Bold.otf') format('opentype');
      font-weight: 700;
      font-display: swap;
    }
    @font-face {
      font-family: 'Pretendard';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Regular.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Pretendard';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Medium.woff2') format('woff2');
      font-weight: 500;
      font-display: swap;
    }
    @font-face {
      font-family: 'Pretendard';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-SemiBold.woff2') format('woff2');
      font-weight: 600;
      font-display: swap;
    }
    @font-face {
      font-family: 'Pretendard';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Bold.woff2') format('woff2');
      font-weight: 700;
      font-display: swap;
    }

    :root {
      --font-title: 'DnfTemperedBlade', 'Pretendard', 'Malgun Gothic', '맑은 고딕', sans-serif;
      --font-body: 'Pretendard', 'Malgun Gothic', '맑은 고딕', sans-serif;
      --bg: #14100b;
      --panel: #1f1811;
      --panel2: #2a2015;
      --border: #6b5228;
      --border-hi: #b98f3e;
      --gold: #f5c451;
      --gold-dim: #c9a04a;
      --text: #e8dcc4;
      --text-dim: #9c8d6e;
      --red: #ff6b5e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    html, body { height: 100%; }

    body {
      min-height: 100vh;
      background: var(--bg);
      background-image: radial-gradient(ellipse at 50% -20%, #2e2312 0%, var(--bg) 60%);
      font-family: var(--font-body);
      color: var(--text);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      word-break: keep-all;
      overflow-x: hidden;
    }

    /* 전체 래퍼 */
    #app {
      width: 100%;
      max-width: 560px;
      padding: 36px 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 헤더 */
    #header { text-align: center; margin-bottom: 26px; width: 100%; }
    #header h1 {
      font-family: var(--font-title);
      font-weight: 700;
      font-size: 42px;
      letter-spacing: 7px;
      filter: drop-shadow(0 0 16px rgba(245, 181, 58, .35)) drop-shadow(0 2px 2px rgba(0, 0, 0, .6));
      margin-bottom: 4px;
    }
    h1 .t-red {
      background: linear-gradient(180deg, #ff8a5c 10%, #e0402a 55%, #b02418 95%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    h1 .t-gold {
      background: linear-gradient(180deg, #ffe792 12%, #f5c451 50%, #e09b2d 92%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #header .label {
      font-family: var(--font-title);
      font-weight: 500;
      font-size: 15px;
      letter-spacing: 5px;
      color: var(--text-dim);
      margin-bottom: 12px;
    }
    #header .subtitle { color: var(--text-dim); font-size: 14px; }
    #header .subtitle span { color: var(--gold); font-weight: 700; }

    /* 탭 */
    #tabs { display: flex; gap: 6px; margin-bottom: 22px; flex-wrap: wrap; justify-content: center; }
    .tab-btn {
      padding: 9px 24px; border-radius: 6px;
      cursor: pointer; font-weight: 700; font-size: 14px;
      background: #0d0a06; border: 1px solid var(--border); color: var(--text-dim);
      transition: all 0.15s; font-family: inherit;
      letter-spacing: 1px; white-space: nowrap;
    }
    .tab-btn.active { background: #2e2410; border-color: var(--gold); color: var(--gold); }

    /* 패널 */
    .panel { width: 100%; display: none; }
    .panel.active { display: block; }

    /* 결과 박스 */
    #result-box {
      background: #0d0a06;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px 16px;
      text-align: center;
      margin-bottom: 20px;
      height: 190px; /* 추첨 중·결과·대기 상태에서 높이가 흔들리지 않도록 고정 */
      overflow: hidden;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
    }
    #result-box .idle-icon { font-size: 40px; margin-bottom: 12px; }
    #result-box .idle-text { color: var(--text-dim); font-size: 15px; }
    /* 추첨 중 / 결과 상태의 3단 구조(라벨·이름·시각)를 동일하게 맞춤 */
    #result-box .draw-label,
    #result-box .result-label {
      font-size: 13px; letter-spacing: 2px;
      height: 20px; line-height: 20px;
      max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #result-box .draw-label { color: var(--text-dim); }
    #result-box .result-label { color: var(--gold-dim); }
    #result-box .draw-name,
    #result-box .result-name {
      font-family: var(--font-title);
      font-size: 46px; letter-spacing: 3px;
      height: 66px; line-height: 66px;
      max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #result-box .draw-name { font-weight: 500; color: var(--text); }
    #result-box .result-name {
      font-weight: 700; color: var(--gold);
      text-shadow: 0 0 26px rgba(245, 196, 81, .55);
      animation: pop .35s ease;
    }
    #result-box .result-time,
    #result-box .draw-time { font-size: 13px; color: var(--text-dim); height: 18px; line-height: 18px; }
    #result-box .done-icon { font-size: 40px; margin-bottom: 12px; }
    #result-box .done-title { font-family: var(--font-title); font-weight: 700; font-size: 22px; color: var(--gold); }
    #result-box .done-sub { font-size: 14px; color: var(--text-dim); margin-top: 8px; }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.45} }
    .animating { animation: blink 0.3s infinite; }
    @keyframes pop {
      0% { transform: scale(.85); }
      60% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    /* 프로그레스 */
    #progress-wrap { margin-bottom: 16px; width: 100%; }
    #progress-header { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-dim); margin-bottom: 8px; }
    #progress-track { background: #0d0a06; border: 1px solid var(--border); border-radius: 999px; height: 10px; }
    #progress-bar {
      height: 8px; margin: 1px; border-radius: 999px;
      background: linear-gradient(90deg, #cf9c35, #f5c451);
      box-shadow: 0 0 10px rgba(245,196,81,.35);
      width: 0%; transition: width 0.5s ease;
    }

    /* KST 시계 */
    #clock-wrap { width: 100%; margin-bottom: 16px; }
    #clock {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%;
      background: #0d0a06;
      border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 18px;
      font-size: 15px; font-weight: 600; color: var(--gold-dim);
      letter-spacing: 1px; font-variant-numeric: tabular-nums;
      flex-wrap: wrap;
    }
    #clock .clock-label {
      font-size: 11px; font-weight: 700; color: var(--gold);
      background: #2e2410; border: 1px solid var(--border);
      padding: 2px 8px; border-radius: 999px; letter-spacing: 1px;
      white-space: nowrap;
    }
    #clock-time { color: var(--gold); }

    /* 버튼 */
    #draw-btn {
      width: 100%; padding: 17px; border-radius: 8px;
      cursor: pointer; font-size: 18px; font-weight: 800;
      letter-spacing: 2px; transition: all 0.15s;
      background: linear-gradient(180deg, #ffe08a, #d5a437);
      border: 2px solid var(--gold);
      color: #1a1206;
      box-shadow: 0 0 24px rgba(245,196,81,.25), 0 4px 12px rgba(0,0,0,.5);
      font-family: inherit; white-space: nowrap;
    }
    #draw-btn:hover:not(:disabled) { filter: brightness(1.08); box-shadow: 0 0 32px rgba(245,196,81,.4); }
    #draw-btn:active:not(:disabled) { transform: translateY(1px); }
    #draw-btn:disabled {
      filter: grayscale(.7) brightness(.55);
      box-shadow: none; cursor: not-allowed;
    }
    .btn-sub {
      display: inline-block;
      margin-left: 8px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      opacity: .7;
      vertical-align: middle;
    }
    #reset-btn, #reset-btn2 {
      width: 100%; margin-top: 12px; padding: 12px;
      border-radius: 8px; border: 1px solid #7a3a30;
      cursor: pointer; background: #2a1410; color: #ff8a7a;
      font-size: 14px; font-weight: 600; transition: all 0.15s;
      font-family: inherit; white-space: nowrap;
    }
    #reset-btn:hover:not(:disabled), #reset-btn2:hover:not(:disabled) { filter: brightness(1.25); }
    #reset-btn:disabled, #reset-btn2:disabled { opacity: .35; cursor: not-allowed; }
    #reset-btn2 { margin-top: 16px; }
    #party-btn {
      width: 100%; padding: 17px; border-radius: 8px;
      cursor: pointer; font-size: 18px; font-weight: 800;
      letter-spacing: 2px; transition: all 0.15s;
      background: linear-gradient(180deg, #ffe08a, #d5a437);
      border: 2px solid var(--gold); color: #1a1206;
      box-shadow: 0 0 24px rgba(245,196,81,.25), 0 4px 12px rgba(0,0,0,.5);
      font-family: inherit; white-space: nowrap;
    }
    #party-btn:hover:not(:disabled) { filter: brightness(1.08); box-shadow: 0 0 32px rgba(245,196,81,.4); }
    #party-btn:active:not(:disabled) { transform: translateY(1px); }
    #party-btn:disabled { filter: grayscale(.7) brightness(.55); cursor: not-allowed; }

    /* 기록 저장/불러오기 */
    .log-actions { display: flex; gap: 8px; margin-bottom: 12px; }
    .btn-mini {
      flex: 1; padding: 11px; border-radius: 8px;
      border: 1px solid var(--border-hi); background: #2e2410; color: var(--gold);
      font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
      letter-spacing: 1px; white-space: nowrap; transition: all .15s;
    }
    .btn-mini:hover { filter: brightness(1.25); }

    /* 로그 */
    #log-empty {
      text-align: center; padding: 60px 24px; color: var(--text-dim);
      background: #0d0a06; border-radius: 8px;
      border: 1px solid var(--border);
    }
    #log-empty .icon { font-size: 36px; margin-bottom: 12px; }
    #log-list { display: flex; flex-direction: column; gap: 8px; }
    .log-item {
      display: flex; align-items: center; justify-content: space-between;
      background: linear-gradient(180deg, var(--panel2), var(--panel));
      border: 1px solid var(--border);
      border-radius: 8px; padding: 13px 16px;
    }
    .log-item.latest { border-color: var(--border-hi); box-shadow: 0 0 14px rgba(245,196,81,.15); }
    .log-item-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .log-num {
      width: 36px; height: 36px; border-radius: 50%;
      background: #0d0a06; border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: var(--text-dim); flex-shrink: 0;
    }
    .log-num.latest {
      background: linear-gradient(180deg, #f7d47a, #cf9c35);
      border-color: var(--gold); color: #1a1206;
    }
    .log-name {
      font-family: var(--font-title); font-weight: 500;
      font-size: 18px; color: var(--text); letter-spacing: 1px;
    }
    .log-item.latest .log-name { color: var(--gold); }
    .log-time { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
    .log-badge {
      font-size: 11px; font-weight: 700; color: var(--gold);
      background: #2e2410; border: 1px solid var(--border-hi);
      padding: 3px 10px; border-radius: 999px; white-space: nowrap;
    }

    /* ── 추첨 모드 ── */
    .mode-box {
      background: linear-gradient(180deg, var(--panel2), var(--panel));
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }
    #roleResetBtn { width: 100%; margin-top: 8px; }
    #roleSelect {
      width: 100%; margin-top: 8px;
      padding: 10px 12px; border-radius: 6px;
      background: #0d0a06; border: 1px solid var(--border-hi); color: var(--gold);
      font-family: inherit; font-size: 14px; font-weight: 600; outline: none; cursor: pointer;
    }

    /* ── 파티 추첨 ── */
    .party-box {
      background: linear-gradient(180deg, var(--panel2), var(--panel));
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 14px;
      margin-bottom: 16px;
    }
    .party-box h3 {
      font-size: 12px; color: var(--text-dim); letter-spacing: 2px;
      margin-bottom: 10px; font-weight: 600;
    }
    .size-row { display: flex; gap: 6px; }
    .size-btn {
      flex: 1; padding: 10px 0; border-radius: 6px;
      background: #0d0a06; border: 1px solid var(--border); color: var(--text-dim);
      font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
      transition: all .15s; white-space: nowrap;
    }
    .size-btn.active { background: #2e2410; border-color: var(--gold); color: var(--gold); }
    .box-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin-bottom: 10px;
    }
    .box-head h3 { margin-bottom: 0; }
    .preset-btn {
      flex: 0 0 auto; padding: 7px 12px; border-radius: 6px;
      background: #0d0a06; border: 1px solid var(--border); color: var(--text-dim);
      font-family: inherit; font-size: 12px; cursor: pointer; transition: all .15s;
      white-space: nowrap;
    }
    .preset-btn:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
    .preset-btn:disabled { opacity: .4; cursor: not-allowed; }

    .slot-list { display: flex; flex-direction: column; gap: 8px; }
    .slot-row {
      display: flex; align-items: center; gap: 10px;
      background: #0d0a06; border: 1px solid var(--border);
      border-left: 3px solid var(--border-hi);
      border-radius: 6px; padding: 10px 12px 10px 10px;
    }
    .slot-no {
      width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
      background: #2e2410; border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: var(--gold-dim);
    }
    .slot-row select {
      flex: 0 0 auto; min-width: 0; width: 120px;
      padding: 7px 8px; border-radius: 6px;
      background: #14100b; border: 1px solid var(--border); color: var(--text);
      font-family: inherit; font-size: 13px; outline: none; cursor: pointer;
    }
    .slot-row select:focus { border-color: var(--gold); }
    .slot-pick {
      flex: 1; min-width: 0; text-align: right;
      font-family: var(--font-title); font-weight: 500;
      font-size: 19px; color: var(--text-dim); letter-spacing: 1px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .slot-pick.done { color: var(--gold); text-shadow: 0 0 12px rgba(245,196,81,.45); animation: pop .3s ease; }
    .ult-tag {
      display: inline-block; margin-left: 7px; padding: 2px 7px;
      border-radius: 999px; border: 1px solid var(--border-hi);
      background: #2e2410; color: var(--gold-dim);
      font-family: var(--font-body); font-size: 11px; font-weight: 700;
      letter-spacing: 0; vertical-align: middle; text-shadow: none;
    }
    .party-note { font-size: 11px; color: var(--text-dim); text-align: center; margin-top: 10px; letter-spacing: 1px; }

    /* 푸터 */
    .footer {
      text-align: center; margin-top: 24px;
      font-size: 12px; color: var(--text-dim); letter-spacing: 2px;
    }
    .footer b { color: var(--gold-dim); }
    .footer-mail { margin-top: 5px; letter-spacing: 1px; }
    .footer-mail a { color: var(--text-dim); text-decoration: none; }
    .footer-mail a:hover { color: var(--gold); }

    /* 모바일 */
    @media (max-width: 480px) {
      #app { padding: 24px 12px 32px; }
      #header h1 { font-size: 32px; letter-spacing: 4px; }
      #header .label { font-size: 12px; letter-spacing: 4px; }
      #result-box { padding: 18px 12px; height: 168px; }
      #result-box .draw-name,
      #result-box .result-name { font-size: 36px; height: 54px; line-height: 54px; letter-spacing: 2px; }
      #draw-btn { padding: 14px; font-size: 16px; }
      .tab-btn { padding: 8px 11px; font-size: 12px; letter-spacing: 0; }
      .btn-sub { margin-left: 6px; font-size: 11px; }
      #clock { font-size: 13px; gap: 7px; padding: 9px 12px; }
      .log-name { font-size: 16px; }
    }
  </style>
</head>
<body>
<div id="app">

  <div id="header">
    <h1><span class="t-red">C</span><span class="t-gold">YPHERS</span></h1>
    <div class="label">캐릭터 랜덤 추첨기</div>
    <div class="subtitle">총 <span id="total-count"></span>명 · 남은 캐릭터 <span id="remain-count"></span>명</div>
  </div>

  <div id="tabs">
    <button class="tab-btn active" data-tab="main" onclick="switchTab('main')">🎲 개인 추첨</button>
    <button class="tab-btn" data-tab="party" onclick="switchTab('party')">👥 파티 추첨</button>
    <button class="tab-btn" data-tab="log" id="log-tab-btn" onclick="switchTab('log')">📋 기록 (0)</button>
  </div>

  <!-- 추첨 패널 -->
  <div class="panel active" id="panel-main">
    <div class="mode-box">
      <div class="size-row">
        <button class="size-btn active" data-mode="all" onclick="setDrawMode('all')">완전 랜덤</button>
        <button class="size-btn" data-mode="role" onclick="setDrawMode('role')">포지션 추첨</button>
      </div>
      <select id="roleSelect" onchange="setDrawRole(this.value)" style="display:none;"></select>
      <button class="preset-btn" id="roleResetBtn" onclick="resetRole()" style="display:none;"></button>
    </div>

    <div id="result-box">
      <div class="idle-icon">🎲</div>
      <div class="idle-text">버튼을 눌러 추첨을 시작하세요</div>
    </div>

    <div id="progress-wrap">
      <div id="progress-header">
        <span>진행률</span>
        <span id="progress-text">0 / 0 (0%)</span>
      </div>
      <div id="progress-track">
        <div id="progress-bar"></div>
      </div>
    </div>
    <!-- KST 시계 -->
    <div id="clock-wrap">
      <div id="clock">
        <span class="clock-label">KST</span>
        <span id="clock-source" style="font-size:11px;font-weight:700;">동기화 중...</span>
        <span id="clock-date" style="font-size:13px;">--년 --월 --일</span>
        <span id="clock-time">--:--:--</span>

  <!-- 파티 추첨 패널 -->
  <div class="panel" id="panel-party">
    <div class="party-box">
      <h3>파티 인원</h3>
      <div class="size-row" id="sizeRow">
        <button class="size-btn" data-size="2" onclick="setPartySize(2)">2인</button>
        <button class="size-btn" data-size="3" onclick="setPartySize(3)">3인</button>
        <button class="size-btn" data-size="4" onclick="setPartySize(4)">4인</button>
        <button class="size-btn active" data-size="5" onclick="setPartySize(5)">5인</button>

      <div class="box-head">
        <h3>슬롯별 포지션</h3>
        <button class="preset-btn" onclick="applyPreset('all')">↺ 포지션 지정 해제</button>
      </div>
      <div class="slot-list" id="slotList"></div>
      <div class="party-note">슬롯마다 전체 또는 역할군을 자유롭게 지정</div>

    <button id="party-btn" onclick="drawParty()">👥 파티 추첨</button>

  <!-- 기록 패널 -->
  <div class="panel" id="panel-log">
    <div class="log-actions">
      <button class="btn-mini" onclick="exportLogFile()">📥 기록 저장 (.json)</button>
      <button class="btn-mini" onclick="document.getElementById('logFile').click()">📤 기록 불러오기</button>
      <input type="file" id="logFile" accept=".json" hidden onchange="importLogFile(this)">

    <div id="log-empty">
      <div class="icon">📋</div>
      <div>아직 추첨 기록이 없습니다</div>

    <div id="log-list"></div>
    <button id="reset-btn2" onclick="resetAll()">🗑 전체 기록 초기화</button>
  </div>

</div>
<script>
const ALL_CHARACTERS = [
  "로라스","휴톤","루이스","타라","트리비아","카인","레나","드렉슬러","도일","토마스",
  "나이오비","시바","웨슬리","스텔라","앨리셔","클레어","다이무스","이글","마를렌","샬럿",
  "레이튼","윌라드","미쉘","린","카를로스","빅터","호타루","트릭시","히카르도","까미유",
  "자네트","피터","레베카","아이작","엘리","브루스","마틴","미아","제레온","드니스",
  "루시","하랑","티엔","J","벨져","리첼","리사","릭","제키엘","탄야",
  "캐럴","라이샌더","루드빅","멜빈","디아나","클리브","헬레나","에바","론","레오노르",
  "시드니","테이","티모시","엘프리데","티샤","카로슈","라이언","파수꾼 A","에밀리","플로리안",
  "케니스","이사벨","헤나투","숙희","그레타","바스티안","재뉴어리","니콜라스","키아라","베로니카",
  "주세페","루카","앤지 헌트","엔데카","오데트"
];

// ── 2026U 시즌 역할군 (공식 매거진 기준) ──
// 이름만 있으면 1차궁, (2nd)가 붙으면 2차궁 — 같은 캐릭터도 궁에 따라 역할군이 다름
const ROLE_DATA = {
  "뱅가드":   ["니콜라스(2nd)","도일","도일(2nd)","디아나","라이언","레오노르","레오노르(2nd)","레이튼(2nd)","리첼","린","브루스","숙희","아이작","에바","엔데카","제키엘","제키엘(2nd)","티모시","티엔","플로리안","휴톤","휴톤(2nd)"],
  "스트라이커": ["그레타(2nd)","니콜라스","디아나(2nd)","레나","레나(2nd)","레베카","레베카(2nd)","레이튼","로라스(2nd)","리첼(2nd)","벨져","스텔라","스텔라(2nd)","아이작(2nd)","이글","제레온","제레온(2nd)","케니스","티모시(2nd)","티엔(2nd)","플로리안(2nd)"],
  "스커미셔": ["다이무스(2nd)","라이샌더","로라스","루드빅","벨져(2nd)","시바","자네트(2nd)","제이","카로슈","카를로스","케니스(2nd)","키아라","테이","트릭시","호타루","호타루(2nd)"],
  "리퍼":     ["그레타","다이무스","루이스","루카","루카(2nd)","이글(2nd)","자네트","카로슈(2nd)","카를로스(2nd)","클리브","테이(2nd)","히카르도"],
  "레인저":   ["까미유(2nd)","나이오비","나이오비(2nd)","드렉슬러(2nd)","론","론(2nd)","루시","루시(2nd)","마를렌","마를렌(2nd)","미쉘(2nd)","바스티안","베로니카","베로니카(2nd)","빅터","빅터(2nd)","샬럿(2nd)","앤지헌트","엘프리데","엘프리데(2nd)","웨슬리","윌라드","윌라드(2nd)","카인","카인(2nd)","클레어(2nd)","타라(2nd)","탄야","탄야(2nd)","트리비아","파수꾼A","피터","하랑(2nd)","헬레나","헬레나(2nd)"],
  "아틸러리": ["드렉슬러","멜빈","미쉘","미아","미아(2nd)","샬럿","엘리","이사벨","클레어","타라","하랑"],
  "컨트롤러": ["까미유","드니스","리사","리사(2nd)","릭","마틴","마틴(2nd)","시드니","시드니(2nd)","앨리셔","앨리셔(2nd)","에밀리","오데트","웨슬리(2nd)","재뉴어리","주세페","캐럴","토마스","토마스(2nd)","티샤","피터(2nd)","헤나투"]
};
// 공식 표기와 추첨기 캐릭터 목록의 이름 차이 보정
const NAME_FIX = { "제이": "J", "앤지헌트": "앤지 헌트", "파수꾼A": "파수꾼 A" };

// "니콜라스(2nd)" → { base: "니콜라스", ult: 2 }
function parseEntry(raw) {
  const m = /^(.*?)\(2nd\)\s*$/.exec(raw);
  const rawBase = (m ? m[1] : raw).trim();
  return { base: NAME_FIX[rawBase] || rawBase, ult: m ? 2 : 1 };
}
const ROLES = {};
Object.keys(ROLE_DATA).forEach(r => { ROLES[r] = ROLE_DATA[r].map(parseEntry); });

function ultLabel(ult) { return ult === 2 ? "2차궁" : "1차궁"; }

function candidatesOf(filter) {
  // 완전 랜덤은 궁 구분 없이 캐릭터 단위
  if (filter === "all" || !ROLES[filter]) return ALL_CHARACTERS.map(c => ({ base: c, ult: 0 }));
  return ROLES[filter];
}
// 캐릭터가 속한 역할군 표시용 (예: "뱅가드 2차궁 / 스트라이커 1차궁")
function rolesOf(name) {
  const out = [];
  Object.keys(ROLES).forEach(r => {
    ROLES[r].forEach(e => { if (e.base === name) out.push(r + " " + ultLabel(e.ult)); });
  });
  return out;
}
function roleMembers(role) {
  return new Set((ROLES[role] || []).map(e => e.base));
}

const STORAGE_KEY = "cyphers-draw-log";
const PARTY_KEY = "cyphers-party-setup";
const TOTAL = ALL_CHARACTERS.length;
let log = [];
let animating = false;
let currentTab = "main";


// ── 초기화 ───────────────────────────────────────
function init() {
  try {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) log = JSON.parse(stored);
  } catch {}
  document.getElementById("total-count").textContent = TOTAL;
  initModeUI();
  loadPartySetup();
  document.querySelectorAll(".size-btn").forEach(b => b.classList.toggle("active", +b.dataset.size === partySize));
  renderSlots();
  render();
}
function saveLog() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(log)); } catch {}
}

// ── 날짜 포맷 ─────────────────────────────────────
function formatDate(iso) {
  const d = new Date(iso);
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

// ── 남은 캐릭터 ───────────────────────────────────
function getRemaining() {
  const drawn = new Set(log.map(e => e.name));
  return ALL_CHARACTERS.filter(c => !drawn.has(c));
}
// 현재 추첨 모드(전체 / 특정 역할군) 기준 후보 — 이미 뽑힌 캐릭터는 궁 상관없이 제외
function getModeRemaining() {
  const drawn = new Set(log.map(e => e.name));
  return candidatesOf(drawMode).filter(e => !drawn.has(e.base));
}

// ── 추첨 모드 (완전 랜덤 / 포지션) ────────────────
let drawMode = "all";     // "all" 또는 역할군명
const MODE_KEY = "cyphers-draw-mode";

// 포지션 모드일 때만 역할군 선택·개별 초기화 버튼 노출
function updateRoleUI() {
  const isRole = drawMode !== "all";
  const btn = document.getElementById("roleResetBtn");
  document.getElementById("roleSelect").style.display = isRole ? "block" : "none";
  btn.style.display = isRole ? "block" : "none";
  if (isRole) {
    const members = roleMembers(drawMode);
    const drawnHere = log.filter(e => members.has(e.name)).length;
    btn.textContent = `↺ ${drawMode} 기록만 초기화 (${drawnHere}건)`;
    btn.disabled = drawnHere === 0;
  }
}

function setDrawMode(kind) {
  if (animating) return;
  const sel = document.getElementById("roleSelect");
  if (kind === "all") {
    drawMode = "all";
    sel.style.display = "none";
  } else {
    // 포지션 모드: 마지막에 고른 역할군 유지, 없으면 첫 번째
    drawMode = ROLES[drawMode] ? drawMode : Object.keys(ROLES)[0];
    sel.value = drawMode;
    sel.style.display = "block";
  }
  document.querySelectorAll(".mode-box .size-btn").forEach(b =>
    b.classList.toggle("active", (b.dataset.mode === "all") === (drawMode === "all")));
  try { localStorage.setItem(MODE_KEY, drawMode); } catch {}
  render();
}

function setDrawRole(role) {
  if (animating) return;
  drawMode = role;
  try { localStorage.setItem(MODE_KEY, drawMode); } catch {}
  render();
}

// 선택한 역할군에 속한 캐릭터의 추첨 기록만 삭제 (전체 초기화와 별개)
function resetRole() {
  if (animating || drawMode === "all") return;
  const members = roleMembers(drawMode);
  const targets = log.filter(e => members.has(e.name));
  if (!targets.length) { alert(`${drawMode} 역할군에서 추첨된 기록이 없습니다.`); return; }
  if (!confirm(`${drawMode} 역할군의 추첨 기록 ${targets.length}건을 초기화할까요?\n(다른 역할군 기록은 그대로 유지됩니다)`)) return;
  log = log.filter(e => !members.has(e.name));
  saveLog();
  document.getElementById("result-box").innerHTML = `
    <div class="idle-icon">🎲</div>
    <div class="idle-text">${drawMode} 기록을 초기화했습니다</div>
  `;
  render();
}

function initModeUI() {
  const sel = document.getElementById("roleSelect");
  sel.innerHTML = Object.keys(ROLES).map(r =>
    `<option value="${r}">${r} (${ROLES[r].length}종)</option>`).join("");
  let saved = "all";
  try { saved = localStorage.getItem(MODE_KEY) || "all"; } catch {}
  drawMode = ROLES[saved] ? saved : "all";
  if (drawMode !== "all") sel.value = drawMode;
  document.querySelectorAll(".mode-box .size-btn").forEach(b =>
    b.classList.toggle("active", (b.dataset.mode === "all") === (drawMode === "all")));
}

// ── 추첨 ──────────────────────────────────────────
function draw() {
  if (animating) return;
  const remaining = getModeRemaining();
  if (remaining.length === 0) {
    if (drawMode !== "all") alert(`${drawMode} 역할군의 캐릭터를 모두 추첨했습니다.`);
    return;
  }
  animating = true;
  document.getElementById("draw-btn").disabled = true;
  const box = document.getElementById("result-box");
  box.innerHTML = `<div class="draw-label">추첨 중...</div><div class="draw-name animating" id="rolling-name"></div><div class="draw-time">&nbsp;</div>`;
  let count = 0;
  const totalFrames = 24;
  const interval = setInterval(() => {
    const rnd = remaining[Math.floor(Math.random() * remaining.length)];
    document.getElementById("rolling-name").textContent = rnd.base;
    count++;
    if (count >= totalFrames) {
      clearInterval(interval);
      const pick = remaining[Math.floor(Math.random() * remaining.length)];
      const entry = { name: pick.base, time: new Date().toISOString() };
      if (drawMode !== "all") { entry.role = drawMode; entry.ult = pick.ult; }
      log.push(entry);
      saveLog();
      animating = false;
      render();
      showResult(entry.name, entry.time, entry.role, entry.ult);
    }
  }, 60);
}

// ── 결과 표시 ─────────────────────────────────────
function showResult(name, time, role, ult) {
  // 포지션 추첨이면 해당 역할군·궁을, 완전 랜덤이면 그 캐릭터가 속한 역할군 전체를 표시
  const roleText = role
    ? ` · ${role} ${ultLabel(ult)}`
    : (rolesOf(name).length ? ` · ${rolesOf(name).join(" / ")}` : "");
  document.getElementById("result-box").innerHTML = `
    <div class="result-label">#${log.length} 추첨 결과${roleText}</div>
    <div class="result-name">${name}</div>
    <div class="result-time">${formatDate(time)}</div>
  `;
}

// ── 기록 파일 저장/불러오기 ───────────────────────
// 브라우저 캐시·인터넷 사용 기록 삭제 시 localStorage 기록이 사라지므로 파일 백업 제공
function exportLogFile() {
  if (!log.length) { alert("저장할 추첨 기록이 없습니다."); return; }
  const now = new Date();
  const pad = n => String(n).padStart(2, "0");
  const stamp = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}`;
  const data = { type: "cyphers-character-log", exported: now.toISOString(), log: log };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `사이퍼즈_캐릭터추첨기록_${stamp}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function importLogFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      const incoming = Array.isArray(data) ? data : data.log;
      if (!Array.isArray(incoming)) throw new Error("bad format");
      const valid = incoming.filter(e => e && typeof e.name === "string" && e.name)
        .map(e => {
          const item = { name: e.name, time: e.time || new Date().toISOString() };
          if (e.role && ROLES[e.role]) { item.role = e.role; item.ult = (e.ult === 2 ? 2 : 1); }
          return item;
        });
      if (!valid.length) { alert("파일에서 불러올 기록을 찾지 못했습니다."); return; }
      if (log.length && !confirm(`현재 기록 ${log.length}건을 파일의 기록 ${valid.length}건으로 교체할까요?`)) return;
      log = valid;
      saveLog();
      render();
      if (getRemaining().length > 0) {
        const last = log[log.length - 1];
        showResult(last.name, last.time, last.role, last.ult);
      }
      alert(`기록 ${valid.length}건을 불러왔습니다.`);
    } catch (e) {
      alert("기록 파일을 읽을 수 없습니다. '기록 저장'으로 만든 .json 파일인지 확인하세요.");
    }
    input.value = "";
  };
  reader.readAsText(file);
}

// ── 초기화 ────────────────────────────────────────
function resetAll() {
  if (!log.length) return;
  if (!confirm("모든 추첨 기록을 초기화할까요? (기록 저장으로 백업 후 진행을 권장합니다)")) return;
  log = [];
  try { localStorage.removeItem(STORAGE_KEY); } catch {}
  document.getElementById("result-box").innerHTML = `
    <div class="idle-icon">🎲</div>
    <div class="idle-text">버튼을 눌러 추첨을 시작하세요</div>
  `;
  render();
}

// ── 탭 전환 ───────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.tab === tab);
  });
  ["main", "party", "log"].forEach(t => {
    document.getElementById("panel-" + t).classList.toggle("active", t === tab);
  });
  if (tab === "log") renderLog();
}

// ── 파티 추첨 ─────────────────────────────────────
const FILTER_OPTIONS = [
  { v: "all", t: "전체" },
  ...Object.keys(ROLES).map(r => ({ v: r, t: r }))
];
let partySize = 5;
let slotFilters = ["all", "all", "all", "all", "all"];
let partyDrawing = false;

function savePartySetup() {
  try { localStorage.setItem(PARTY_KEY, JSON.stringify({ size: partySize, filters: slotFilters })); } catch {}
}
function loadPartySetup() {
  try {
    const s = JSON.parse(localStorage.getItem(PARTY_KEY));
    if (s && s.size >= 2 && s.size <= 5 && Array.isArray(s.filters)) {
      partySize = s.size;
      // 삭제된 근거리/원거리 등 유효하지 않은 값은 '전체'로 정리
      slotFilters = s.filters.slice(0, 5).map(f => (f === "all" || ROLES[f]) ? f : "all");
      while (slotFilters.length < 5) slotFilters.push("all");
    }
  } catch {}
}

function setPartySize(n) {
  if (partyDrawing) return;
  partySize = n;
  document.querySelectorAll(".size-btn").forEach(b => b.classList.toggle("active", +b.dataset.size === n));
  renderSlots();
  savePartySetup();
}

function applyPreset(kind) {
  if (partyDrawing) return;
  if (kind === "all") slotFilters = ["all", "all", "all", "all", "all"];
  renderSlots();
  savePartySetup();
}

function renderSlots() {
  const box = document.getElementById("slotList");
  box.innerHTML = "";
  for (let i = 0; i < partySize; i++) {
    const row = document.createElement("div");
    row.className = "slot-row";
    const opts = FILTER_OPTIONS.map(o =>
      `<option value="${o.v}"${slotFilters[i] === o.v ? " selected" : ""}>${o.t}</option>`).join("");
    row.innerHTML =
      `<div class="slot-no">${i + 1}</div>` +
      `<select onchange="slotFilters[${i}]=this.value; savePartySetup();">${opts}</select>` +
      `<div class="slot-pick" id="slot-pick-${i}">?</div>`;
    box.appendChild(row);
  }
}

async function drawParty() {
  if (partyDrawing) return;
  // 조합이 가능한지 먼저 확인 (같은 역할군을 인원보다 많이 지정한 경우 등)
  const picked = [];  // 같은 캐릭터는 궁이 달라도 파티 내 중복 불가
  const plan = [];
  for (let i = 0; i < partySize; i++) {
    const pool = candidatesOf(slotFilters[i]).filter(e => !picked.includes(e.base));
    if (!pool.length) {
      const label = FILTER_OPTIONS.find(o => o.v === slotFilters[i]).t;
      alert(`${i + 1}번 슬롯(${label})에 배정할 수 있는 캐릭터가 없습니다.\n포지션 구성을 조정해 주세요.`);
      return;
    }
    const pick = pool[Math.floor(Math.random() * pool.length)];
    picked.push(pick.base);
    plan.push(pick);
  }

  partyDrawing = true;
  const btn = document.getElementById("party-btn");
  btn.disabled = true;
  document.querySelectorAll(".slot-row select, .size-btn, .preset-btn").forEach(el => el.disabled = true);

  for (let i = 0; i < partySize; i++) {
    const el = document.getElementById("slot-pick-" + i);
    const pool = candidatesOf(slotFilters[i]);
    el.classList.remove("done");
    await new Promise(resolve => {
      const start = Date.now();
      const dur = 700;
      function step() {
        const t = Date.now() - start;
        if (t >= dur) {
          // 포지션 지정 슬롯이면 어떤 궁인지 함께 표시
          el.innerHTML = plan[i].ult
            ? `${plan[i].base}<span class="ult-tag">${ultLabel(plan[i].ult)}</span>`
            : plan[i].base;
          el.classList.add("done");
          resolve();
          return;
        }
        el.textContent = pool[Math.floor(Math.random() * pool.length)].base;
        setTimeout(step, 50 + 170 * Math.pow(t / dur, 2));
      }
      step();
    });
  }

  partyDrawing = false;
  btn.disabled = false;
  document.querySelectorAll(".slot-row select, .size-btn, .preset-btn").forEach(el => el.disabled = false);
}

// ── UI 렌더 ───────────────────────────────────────
function render() {
  const remaining = getRemaining();
  const drawn = TOTAL - remaining.length;
  const pct = Math.round((drawn / TOTAL) * 100);
  const allDone = remaining.length === 0;

  document.getElementById("remain-count").textContent = remaining.length;
  document.getElementById("log-tab-btn").textContent = `📋 기록 (${log.length})`;
  document.getElementById("progress-text").textContent = `${drawn} / ${TOTAL} (${pct}%)`;
  document.getElementById("progress-bar").style.width = pct + "%";

  const drawBtn = document.getElementById("draw-btn");
  const modeLeft = getModeRemaining().length;
  if (allDone) {
    drawBtn.disabled = true;
    drawBtn.textContent = "모든 캐릭터 추첨 완료";
    document.getElementById("result-box").innerHTML = `
      <div class="done-icon">🎉</div>
      <div class="done-title">전체 추첨 완료!</div>
      <div class="done-sub">${TOTAL}명 모두 추첨되었습니다</div>
    `;
  } else if (modeLeft === 0) {
    drawBtn.disabled = true;
    drawBtn.innerHTML = `🎲 ${drawMode} 추첨<span class="btn-sub">남은 캐릭터 없음</span>`;
  } else {
    drawBtn.disabled = false;
    drawBtn.innerHTML = drawMode === "all"
      ? `🎲 추첨하기 (${log.length + 1}번째)`
      : `🎲 ${drawMode} 추첨<span class="btn-sub">남은 캐릭터 ${modeLeft}명</span>`;
  }

  document.getElementById("reset-btn").disabled = log.length === 0;
  document.getElementById("reset-btn2").disabled = log.length === 0;
  updateRoleUI();
  if (currentTab === "log") renderLog();
}

function renderLog() {
  const empty = document.getElementById("log-empty");
  const list = document.getElementById("log-list");
  if (log.length === 0) {
    empty.style.display = "block";
    list.innerHTML = "";
    return;
  }
  empty.style.display = "none";
  const reversed = [...log].reverse();
  list.innerHTML = reversed.map((entry, i) => `
    <div class="log-item ${i === 0 ? 'latest' : ''}">
      <div class="log-item-left">
        <div class="log-num ${i === 0 ? 'latest' : ''}">${log.length - i}</div>
        <div>
          <div class="log-name">${entry.name}</div>
          <div class="log-time">${entry.role ? entry.role + " " + ultLabel(entry.ult) + " · " : ""}${formatDate(entry.time)}</div>
        </div>
      </div>
      ${i === 0 ? '<div class="log-badge">최근</div>' : ''}
    </div>
  `).join("");
}

// ── KST 시계 (worldtimeapi.org 서버 시간) ────────
let serverOffset = null;
let usingServer = false;

async function syncServerTime() {
  const APIS = [
    async () => {
      const res = await fetch('https://worldtimeapi.org/api/timezone/Asia/Seoul', { cache: 'no-store' });
      const data = await res.json();
      return new Date(data.datetime).getTime();
    },
    async () => {
      const res = await fetch('https://timeapi.io/api/time/current/zone?timeZone=Asia%2FSeoul', { cache: 'no-store' });
      const data = await res.json();
      return new Date(data.dateTime).getTime();
    }
  ];

  for (const api of APIS) {
    try {
      const before = Date.now();
      const serverMs = await api();
      const after = Date.now();
      // 왕복 지연의 절반을 보정
      serverOffset = serverMs - Math.round((before + after) / 2);
      usingServer = true;
      updateClockLabel(true);
      return;
    } catch {}
  }
  // 모든 API 실패 시 PC 시간
  serverOffset = 0;
  usingServer = false;
  updateClockLabel(false);
}

function updateClockLabel(isServer) {
  const el = document.getElementById('clock-source');
  if (el) {
    el.textContent = isServer ? '🟢 서버' : '🔴 PC';
    el.title = isServer ? 'worldtimeapi.org 서버 시간' : '서버 연결 실패 - PC 시간 사용 중';
  }
}

function getServerTime() {
  const now = new Date(Date.now() + (serverOffset ?? 0));
  return now.toLocaleTimeString('ko-KR', { timeZone: 'Asia/Seoul', hour12: false });
}

function tickClock() {
  const el = document.getElementById('clock-time');
  if (!el) return;
  if (serverOffset === null) { el.textContent = '동기화 중...'; return; }
  el.textContent = getServerTime();
  const now = new Date(Date.now() + (serverOffset ?? 0));
  const yy = String(now.getFullYear()).slice(2);
  const mm = String(now.getMonth() + 1).padStart(2, '0');
  const dd = String(now.getDate()).padStart(2, '0');
  const dateEl = document.getElementById('clock-date');
  if (dateEl) dateEl.textContent = yy + '년 ' + mm + '월 ' + dd + '일';
}

syncServerTime().then(() => tickClock());
setInterval(tickClock, 1000);
setInterval(syncServerTime, 60000);

init();
</script>
